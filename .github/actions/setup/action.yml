name: Node setup
description: Setup Node 24, pnpm, and restore node_modules cache

outputs:
  cache-hit:
    description: Whether node_modules cache was restored
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - id: cache
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}
